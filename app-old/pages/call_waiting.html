<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>콜 대기 - 기사용 앱</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <script type="text/javascript" src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=ae9cce23e8367af0be888d1657d525e7"></script>
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 0;
        }
        .app-container {
            width: 411px;
            height: 731px;
            margin: 20px auto;
            background-color: #fff;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            position: relative;
            border-radius: 20px;
            overflow: hidden;
            padding-bottom: 70px;
        }
        
        /* 작은 Android 화면 (360x640) 대응 */
        @media (max-width: 411px) {
            .app-container {
                width: 360px;
                height: 640px;
                margin: 10px auto;
                border-radius: 15px;
                padding-bottom: 60px;
            }
            
            .header {
                padding: 12px;
            }
            
            .status-card {
                margin: 10px;
                padding: 8px 12px;
            }
            
            .share-icon {
                top: 16px;
                right: 10px;
                width: 38px;
                height: 38px;
                font-size: 16px;
            }
            
            .call-request {
                margin: 10px;
                padding: 12px;
            }
            
            .map-container {
                margin: 10px;
                height: 150px;
            }
            
            .waiting-animation {
                padding: 30px 0;
            }
            
            .bottom-nav {
                height: 60px;
                border-radius: 0 0 15px 15px;
            }
        }
        .header {
            background-color: #1976d2;
            color: white;
            padding: 15px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .status-card {
            background-color: white;
            border-radius: 10px;
            padding: 12px 20px;
            margin: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            position: relative;
        }
        .share-icon {
            position: absolute;
            top: 20px;
            right: 15px;
            background: linear-gradient(135deg, #ff9800, #f57c00);
            color: white;
            width: 42px;
            height: 42px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 18px;
            box-shadow: 0 4px 8px rgba(255, 152, 0, 0.3);
            transition: all 0.3s ease;
            border: 2px solid #fff;
            z-index: 5;
        }
        .share-icon:hover {
            background: linear-gradient(135deg, #f57c00, #e65100);
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(255, 152, 0, 0.4);
        }
        .share-icon:active {
            transform: translateY(0);
        }
        .share-tooltip {
            position: absolute;
            top: 50px;
            right: 0;
            background-color: #333;
            color: white;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 13px;
            white-space: nowrap;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            z-index: 15;
            font-weight: 500;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
        .share-tooltip::before {
            content: '';
            position: absolute;
            bottom: 100%;
            right: 15px;
            border: 6px solid transparent;
            border-bottom-color: #333;
        }
        .share-icon:hover .share-tooltip {
            opacity: 1;
            visibility: visible;
            top: 55px;
        }
        .status-indicator {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 20px;
            font-weight: bold;
            margin-right: 10px;
        }
        .status-waiting {
            background-color: #bbdefb;
            color: #1976d2;
        }
        .call-request {
            background-color: #fff;
            border-radius: 10px;
            padding: 20px;
            margin: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            display: none;
        }
        .call-request.active {
            display: block;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(25, 118, 210, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(25, 118, 210, 0); }
            100% { box-shadow: 0 0 0 0 rgba(25, 118, 210, 0); }
        }
        .call-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        .btn-accept {
            flex: 1;
            background-color: #4caf50;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 5px;
            font-weight: bold;
        }
        .btn-decline {
            flex: 1;
            background-color: #f44336;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 5px;
            font-weight: bold;
        }
        .btn-share {
            flex: 1;
            background-color: #ff9800;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 5px;
            font-weight: bold;
        }
        .waiting-animation {
            text-align: center;
            padding: 40px 0;
        }
        .waiting-animation i {
            font-size: 60px;
            color: #1976d2;
            animation: spin 2s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .waiting-text {
            margin-top: 20px;
            font-size: 18px;
            color: #333;
        }
        .bottom-nav {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: white;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            box-shadow: 0 -2px 5px rgba(0,0,0,0.1);
            height: 70px;
            border-radius: 0 0 20px 20px;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #757575;
            text-decoration: none;
            font-size: 0.8rem;
        }
        .nav-item.active {
            color: #1976d2;
        }
        .nav-icon {
            font-size: 1.5rem;
            margin-bottom: 5px;
        }
        .map-container {
            height: 200px;
            margin: 15px;
            border-radius: 10px;
            overflow: hidden;
            background-color: #e0e0e0;
            position: relative;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="header">
            <h1 class="h5 mb-0" id="headerTitle">콜 대기</h1>
        </div>
        
        <div class="status-card">
            <div class="share-icon" onclick="shareCall()">
                <i class="bi bi-share-fill"></i>
                <div class="share-tooltip">콜 공유 페이지</div>
            </div>
            <h2 class="h6 mb-3">현재 상태</h2>
            <div class="d-flex align-items-center mb-3">
                <span class="status-indicator status-waiting">대기중</span>
                <span>콜을 기다리는 중입니다</span>
            </div>
        </div>
        
        <div class="waiting-animation">
            <i class="bi bi-arrow-repeat"></i>
            <div class="waiting-text">콜을 기다리는 중입니다...</div>
        </div>
        
        <div class="call-request" id="callRequest">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h3 class="h5 mb-0">새로운 콜 요청</h3>
                <span class="badge bg-danger" id="callType">(긴급)</span>
            </div>
            <div class="mt-3">
                <p><strong>날짜:</strong> <span id="callDate">2024년 1월 15일 14:30</span></p>
                <p><strong>출발지:</strong> 서울시 강남구 테헤란로 152</p>
                <p><strong>목적지:</strong> 서울시 강남구 삼성로 513</p>
                <p><strong>예상 거리:</strong> 3.2km</p>
            </div>
            <div class="call-actions">
                <button class="btn-accept" onclick="acceptCall()">수락</button>
                <button class="btn-decline" onclick="declineCall()">거절</button>
                <button class="btn-share" onclick="shareCall()">콜 공유</button>
            </div>
        </div>
        
        <!-- 하단 네비게이션 -->
        <div class="bottom-nav">
            <a href="driver.html" class="nav-item" onclick="window.location.href='driver.html'; return false;">
                <i class="bi bi-house-door nav-icon"></i>
                <span>홈</span>
            </a>
            <a href="call_waiting.html" class="nav-item active" onclick="window.location.href='call_waiting.html'; return false;">
                <i class="bi bi-telephone nav-icon"></i>
                <span>콜 대기</span>
            </a>
            <a href="driving.html" class="nav-item" onclick="window.location.href='driving.html'; return false;">
                <i class="bi bi-car-front nav-icon"></i>
                <span>운행중</span>
            </a>
            <a href="reservations.html" class="nav-item" onclick="window.location.href='reservations.html'; return false;">
                <i class="bi bi-calendar nav-icon"></i>
                <span>예약내역</span>
            </a>
            <a href="settings.html" class="nav-item" onclick="window.location.href='settings.html'; return false;">
                <i class="bi bi-gear nav-icon"></i>
                <span>설정</span>
            </a>
        </div>
    </div>

    <script>
        // 카카오맵 초기화
        let map;
        
        function initMap() {
            // 지도를 표시할 div 
            const container = document.getElementById('map');
            // 지도의 중심좌표
            const options = {
                center: new kakao.maps.LatLng(37.4989, 127.0300), // 강남 중심
                level: 5 // 지도의 확대 레벨
            };
            
            // 지도 생성
            map = new kakao.maps.Map(container, options);
            
            // 출발 마커 생성
            const startMarker = new kakao.maps.Marker({
                position: new kakao.maps.LatLng(37.5033, 127.0447), // 테헤란로 152 근처
                map: map
            });
            
            // 도착 마커 생성
            const endMarker = new kakao.maps.Marker({
                position: new kakao.maps.LatLng(37.5096, 127.0653), // 삼성로 513 근처
                map: map
            });
        }
        
        // 콜 요청 시뮬레이션
        setTimeout(function() {
            // 현재 날짜/시간 설정
            const now = new Date();
            const dateString = now.getFullYear() + '년 ' + 
                              (now.getMonth() + 1) + '월 ' + 
                              now.getDate() + '일 ' + 
                              String(now.getHours()).padStart(2, '0') + ':' + 
                              String(now.getMinutes()).padStart(2, '0');
            document.getElementById('callDate').textContent = dateString;
            
            // 랜덤하게 긴급/예약 설정
            const callTypeElement = document.getElementById('callType');
            const isUrgent = Math.random() > 0.5;
            if (isUrgent) {
                callTypeElement.textContent = '(긴급)';
                callTypeElement.className = 'badge bg-danger';
            } else {
                callTypeElement.textContent = '(예약)';
                callTypeElement.className = 'badge bg-primary';
            }
            
            document.getElementById('callRequest').classList.add('active');
            document.querySelector('.waiting-animation').style.display = 'none';
        }, 5000); // 5초 후 콜 요청 표시
        
        function acceptCall() {
            alert('콜을 수락했습니다. 운행 화면으로 이동합니다.');
            window.location.href = 'driving.html';
        }
        
        function declineCall() {
            document.getElementById('callRequest').classList.remove('active');
            document.querySelector('.waiting-animation').style.display = 'block';
            setTimeout(function() {
                // 현재 날짜/시간 설정
                const now = new Date();
                const dateString = now.getFullYear() + '년 ' + 
                                  (now.getMonth() + 1) + '월 ' + 
                                  now.getDate() + '일 ' + 
                                  String(now.getHours()).padStart(2, '0') + ':' + 
                                  String(now.getMinutes()).padStart(2, '0');
                document.getElementById('callDate').textContent = dateString;
                
                // 랜덤하게 긴급/예약 설정
                const callTypeElement = document.getElementById('callType');
                const isUrgent = Math.random() > 0.5;
                if (isUrgent) {
                    callTypeElement.textContent = '(긴급)';
                    callTypeElement.className = 'badge bg-danger';
                } else {
                    callTypeElement.textContent = '(예약)';
                    callTypeElement.className = 'badge bg-primary';
                }
                
                document.getElementById('callRequest').classList.add('active');
                document.querySelector('.waiting-animation').style.display = 'none';
            }, 10000); // 10초 후 다시 콜 요청
        }
        
        function shareCall() {
            // 현재 콜 요청이 활성화되어 있는지 확인
            const callRequest = document.getElementById('callRequest');
            let params = new URLSearchParams();
            
            if (callRequest.classList.contains('active')) {
                // 콜 정보가 있는 경우 정보 수집
                const callDate = document.getElementById('callDate').textContent;
                const callType = document.getElementById('callType').textContent;
                
                // DOM에서 출발지와 목적지 정보 추출
                const locationElements = callRequest.querySelectorAll('p');
                let startLocation = '서울시 강남구 테헤란로 152';
                let endLocation = '서울시 강남구 삼성로 513';
                let distance = '3.2km';
                
                // 실제 DOM에서 정보 추출
                locationElements.forEach(p => {
                    const text = p.textContent;
                    if (text.includes('출발지:')) {
                        startLocation = text.replace('출발지:', '').trim();
                    } else if (text.includes('목적지:')) {
                        endLocation = text.replace('목적지:', '').trim();
                    } else if (text.includes('예상 거리:')) {
                        distance = text.replace('예상 거리:', '').trim();
                    }
                });
                
                // URL 파라미터로 콜 정보 전달
                params = new URLSearchParams({
                    startLocation: startLocation,
                    endLocation: endLocation,
                    callDate: callDate,
                    callType: callType,
                    distance: distance,
                    autoOpen: 'true'
                });
            }
            
            // 헤더 텍스트를 잠시 변경
            const headerTitle = document.getElementById('headerTitle');
            const originalText = headerTitle.textContent;
            headerTitle.textContent = '콜 공유 페이지로 이동중...';
            headerTitle.style.color = '#ff9800';
            
            // 0.8초 후 페이지 이동
            setTimeout(function() {
                window.location.href = 'call_share.html' + (params.toString() ? '?' + params.toString() : '');
            }, 800);
        }
    </script>
</body>
</html>
