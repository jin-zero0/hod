<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>설정 - 기사용 앱</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 0;
        }
        .app-container {
            width: 411px;
            height: 731px;
            margin: 20px auto;
            background-color: #fff;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            position: relative;
            border-radius: 20px;
            overflow: hidden;
            padding-bottom: 70px;
        }
        
        /* 작은 Android 화면 (360x640) 대응 */
        @media (max-width: 411px) {
            .app-container {
                width: 360px;
                height: 640px;
                margin: 10px auto;
                border-radius: 15px;
                padding-bottom: 60px;
            }
            
            .header {
                padding: 12px;
            }
            
            .profile-section {
                padding: 15px;
            }
            
            .profile-image {
                width: 70px;
                height: 70px;
            }
            
            .profile-image i {
                font-size: 35px;
            }
            
            .profile-name {
                font-size: 16px;
            }
            
            .profile-info {
                font-size: 13px;
            }
            
            .settings-section {
                padding: 15px;
            }
            
            .section-title {
                font-size: 15px;
            }
            
            .settings-item {
                padding: 12px 0;
            }
            
            .item-icon {
                width: 25px;
                height: 25px;
                margin-right: 12px;
            }
            
            .item-text {
                font-size: 14px;
            }
            
            .item-value {
                font-size: 13px;
            }
            
            .bottom-nav {
                height: 60px;
                border-radius: 0 0 15px 15px;
            }
        }
        .header {
            background-color: #1976d2;
            color: white;
            padding: 15px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .profile-section {
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid #f1f1f1;
        }
        .profile-image {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background-color: #e0e0e0;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px;
            overflow: hidden;
        }
        .profile-image i {
            font-size: 40px;
            color: #9e9e9e;
        }
        .profile-name {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .profile-info {
            color: #757575;
            font-size: 14px;
        }
        .settings-section {
            padding: 20px;
        }
        .section-title {
            font-size: 16px;
            font-weight: bold;
            color: #1976d2;
            margin-bottom: 15px;
        }
        .settings-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .settings-item {
            padding: 15px 0;
            border-bottom: 1px solid #f1f1f1;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .settings-item:last-child {
            border-bottom: none;
        }
        .item-label {
            display: flex;
            align-items: center;
        }
        .item-icon {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background-color: #e3f2fd;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 15px;
            color: #1976d2;
        }
        .item-text {
            font-size: 15px;
        }
        .item-value {
            color: #9e9e9e;
            font-size: 14px;
            display: flex;
            align-items: center;
        }
        .item-value i {
            margin-left: 5px;
        }
        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 24px;
        }
        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        .toggle-slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: .4s;
            border-radius: 24px;
        }
        .toggle-slider:before {
            position: absolute;
            content: "";
            height: 16px;
            width: 16px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }
        input:checked + .toggle-slider {
            background-color: #1976d2;
        }
        input:checked + .toggle-slider:before {
            transform: translateX(26px);
        }
        .logout-btn {
            display: block;
            width: 100%;
            padding: 15px;
            background-color: #f44336;
            color: white;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            margin-top: 20px;
            cursor: pointer;
        }
        .bottom-nav {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: white;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            box-shadow: 0 -2px 5px rgba(0,0,0,0.1);
            height: 70px;
            border-radius: 0 0 20px 20px;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #757575;
            text-decoration: none;
            font-size: 0.8rem;
        }
        .nav-item.active {
            color: #1976d2;
        }
        .nav-icon {
            font-size: 1.5rem;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="header">
            <h1 class="h5 mb-0">설정</h1>
        </div>
        
        <div class="profile-section">
            <div class="profile-image">
                <i class="bi bi-person-fill"></i>
            </div>
            <div class="profile-name">홍길동</div>
            <div class="profile-info">서울 12가 3456 | 010-1234-5678</div>
        </div>
        
        <div class="settings-section">
            <h2 class="section-title">계정 설정</h2>
            <ul class="settings-list">
                <li class="settings-item">
                    <div class="item-label">
                        <div class="item-icon">
                            <i class="bi bi-person"></i>
                        </div>
                        <div class="item-text">개인정보 수정</div>
                    </div>
                    <div class="item-value">
                        <i class="bi bi-chevron-right"></i>
                    </div>
                </li>
                <li class="settings-item">
                    <div class="item-label">
                        <div class="item-icon">
                            <i class="bi bi-shield-lock"></i>
                        </div>
                        <div class="item-text">비밀번호 변경</div>
                    </div>
                    <div class="item-value">
                        <i class="bi bi-chevron-right"></i>
                    </div>
                </li>
                <li class="settings-item">
                    <div class="item-label">
                        <div class="item-icon">
                            <i class="bi bi-car-front"></i>
                        </div>
                        <div class="item-text">차량 정보</div>
                    </div>
                    <div class="item-value">
                        <i class="bi bi-chevron-right"></i>
                    </div>
                </li>
            </ul>
        </div>
        
        <div class="settings-section">
            <h2 class="section-title">앱 설정</h2>
            <ul class="settings-list">
                <li class="settings-item">
                    <div class="item-label">
                        <div class="item-icon">
                            <i class="bi bi-bell"></i>
                        </div>
                        <div class="item-text">알림 설정</div>
                    </div>
                    <div class="item-value">
                        <label class="toggle-switch">
                            <input type="checkbox" checked>
                            <span class="toggle-slider"></span>
                        </label>
                    </div>
                </li>
                <li class="settings-item">
                    <div class="item-label">
                        <div class="item-icon">
                            <i class="bi bi-geo-alt"></i>
                        </div>
                        <div class="item-text">위치 서비스</div>
                    </div>
                    <div class="item-value">
                        <label class="toggle-switch">
                            <input type="checkbox" checked>
                            <span class="toggle-slider"></span>
                        </label>
                    </div>
                </li>
                <li class="settings-item">
                    <div class="item-label">
                        <div class="item-icon">
                            <i class="bi bi-moon"></i>
                        </div>
                        <div class="item-text">다크 모드</div>
                    </div>
                    <div class="item-value">
                        <label class="toggle-switch">
                            <input type="checkbox">
                            <span class="toggle-slider"></span>
                        </label>
                    </div>
                </li>
            </ul>
        </div>
        
        <div class="settings-section">
            <h2 class="section-title">기타</h2>
            <ul class="settings-list">
                <li class="settings-item">
                    <div class="item-label">
                        <div class="item-icon">
                            <i class="bi bi-question-circle"></i>
                        </div>
                        <div class="item-text">고객센터</div>
                    </div>
                    <div class="item-value">
                        <i class="bi bi-chevron-right"></i>
                    </div>
                </li>
                <li class="settings-item">
                    <div class="item-label">
                        <div class="item-icon">
                            <i class="bi bi-info-circle"></i>
                        </div>
                        <div class="item-text">앱 정보</div>
                    </div>
                    <div class="item-value">
                        v1.0.0
                    </div>
                </li>
            </ul>
            
            <button class="logout-btn" onclick="logout()">로그아웃</button>
        </div>
        
        <!-- 하단 네비게이션 -->
        <div class="bottom-nav">
            <a href="driver.html" class="nav-item" onclick="window.location.href='driver.html'; return false;">
                <i class="bi bi-house-door nav-icon"></i>
                <span>홈</span>
            </a>
            <a href="call_waiting.html" class="nav-item" onclick="window.location.href='call_waiting.html'; return false;">
                <i class="bi bi-telephone nav-icon"></i>
                <span>콜 대기</span>
            </a>
            <a href="driving.html" class="nav-item" onclick="window.location.href='driving.html'; return false;">
                <i class="bi bi-car-front nav-icon"></i>
                <span>운행중</span>
            </a>
            <a href="reservations.html" class="nav-item" onclick="window.location.href='reservations.html'; return false;">
                <i class="bi bi-calendar nav-icon"></i>
                <span>예약내역</span>
            </a>
            <a href="settings.html" class="nav-item active" onclick="window.location.href='settings.html'; return false;">
                <i class="bi bi-gear nav-icon"></i>
                <span>설정</span>
            </a>
        </div>
    </div>

    <script>
        function logout() {
            if (confirm('로그아웃 하시겠습니까?')) {
                alert('로그아웃 되었습니다.');
                window.location.href = 'main.html';
            }
        }
    </script>
</body>
</html>
